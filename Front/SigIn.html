<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Uy es hoy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen flex items-center justify-center 
            bg-gradient-to-br from-indigo-950 via-purple-900 to-indigo-950 
            text-gray-100">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
        
        <h2 class="text-3xl font-bold text-center mb-2 text-white">Evolution </h2>
        <p class="text-center text-gray-400 mb-6">Ingresa a tu cuenta para seguir jugando.</p>
        

        <form action="#" method="POST" id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                    Correo Electrónico
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="email"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                    Contraseña
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="••••••••"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
            </div>
            <div id="error-message" 
                 class="hidden bg-red-800 border border-red-600 text-red-100 px-4 py-3 rounded-lg mb-4 text-center">
                </div>

            <div class="mb-6">
                <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 ease-in-out transform hover:-translate-y-1">
                    Iniciar Sesión
                </button>
            </div>

            <div class="flex justify-between items-center text-sm">
                <a href="#" class="text-gray-400 hover:text-blue-400 hover:underline">
                    ¿Olvidaste tu contraseña?
                </a>
                <a href="registro.html" class="text-blue-400 hover:text-blue-300 font-medium hover:underline">
                    Crear cuenta
                </a>
            </div>

        </form>
    </div>
<script type="module" src="js/login.js"></script>
    <script src="js/utils.js"></script>
</body>
</html>
