<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-R" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/admin-guard.js"></script>
    <title>Panel de Administrador - Transacciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-blue-900 text-gray-100 min-h-screen p-8"
    data-page="admin">
    <div class="container mx-auto max-w-6xl">

        <header class="mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">Panel de Administrador</h1>
        <p class="text-xl text-gray-300">Historial de Transacciones</p>
        
        <div class="space-x-4 mt-4"> 
            
            <a href="Estadisticas.html" class="text-lg text-blue-400 font-bold border-b-2 border-blue-400 pb-1">
                Ver Estadísticas
            </a>

            <a href="index.html" class="text-lg text-blue-400 font-bold border-b-2 border-blue-400 pb-1">
                Tienda
            </a>
           <a href="juegosAdmin.html" class="text-lg text-blue-400 font-bold border-b-2 border-blue-400 pb-1">
                Panel de Juegos
            </a>
            <a href=""></a>
        </div>
        </header>
        <div class="bg-gray-800 rounded-xl shadow-2xl overflow-hidden">
                <h2 class="text-3xl font-bold mb-6 text-white">Panel de Administración</h2>

                <section class="mb-6 p-4 bg-gray-800 rounded-xl shadow-lg">
                    <h3 class="text-xl font-semibold mb-4 text-blue-400">Filtrar Transacciones</h3>
                    <div class="flex flex-wrap gap-4 items-end">
                        <div>
                            <label for="fecha-inicio" class="block text-sm font-medium text-gray-300 mb-1">Fecha
                                Inicio:</label>
                            <input type="date" id="fecha-inicio"
                                class="bg-gray-700 border border-gray-600 rounded-md p-2 text-white focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="fecha-fin" class="block text-sm font-medium text-gray-300 mb-1">Fecha
                                Fin:</label>
                            <input type="date" id="fecha-fin"
                                class="bg-gray-700 border border-gray-600 rounded-md p-2 text-white focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <button id="btn-filtrar-fechas"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors">
                            Filtrar
                        </button>
                        <button id="btn-limpiar-fechas"
                            class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md transition-colors">
                            Limpiar
                        </button>
                    </div>
                </section>
                <section id="tabla-transacciones-container">
                </section>
            </div>
            <table class="min-w-full divide-y divide-gray-700">
                <thead class="bg-gray-700">
                    <tr>
                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">
                            ID Transacción
                        </th>

                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">
                            <button id="sort-fecha" data-column="fecha"
                                class="sort-button flex items-center space-x-1 px-2 py-1 rounded-md bg-gray-800 ">
                                <span>Fecha</span>
                                <span class="sort-icon"></span> </button>
                        </th>

                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">
                            Email Usuario
                        </th>
                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">
                            Tipo
                        </th>

                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">
                            <button id="sort-total" data-column="total"
                                class="sort-button flex items-center space-x-1  px-2 py-1 rounded-md bg-gray-800">
                                <span>Total</span>
                                <span class="sort-icon"></span> </button>
                        </th>

                        <th scope="col" class="relative px-6 py-3">
                            <span class="sr-only">Acciones</span>
                        </th>
                    </tr>
                </thead>

                <tbody id="transacciones-tbody" class="bg-gray-800 divide-y divide-gray-700">
                    <tr>
                        <td colspan="6" class="px-6 py-4 whitespace-nowrap text-center text-gray-400">
                            Cargando transacciones...
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>
    </div>
    <div id="detalle-modal"
        class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 hidden z-50">

        <div id="modal-content"
            class="bg-gray-800 rounded-xl shadow-2xl w-full max-w-2xl transform transition-all opacity-0 scale-95">

            <div class="flex justify-between items-center p-6 border-b border-gray-700">
                <h2 class="text-2xl font-bold text-white">Detalles de la Transacción</h2>
                <button id="modal-close-btn" class="text-gray-400 hover:text-white text-3xl">&times;</button>
            </div>

            <div id="modal-body" class="p-6 max-h-[60vh] overflow-y-auto">
                <p id="modal-loading-text" class="text-center text-gray-300">Cargando detalles...</p>

            </div>
        </div>
    </div>
<section id="paginacion-admin" class="flex justify-center items-center mt-8 space-x-2 overflow-x-auto"></section>
    <script type="module" src="js/main.js"></script>
</body>
</html>
