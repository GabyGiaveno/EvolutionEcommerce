<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Uy es hoy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="min-h-screen flex items-center justify-center 
            bg-gradient-to-br from-indigo-950 via-purple-900 to-indigo-950 
            text-gray-100">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md">

        <h2 class="text-3xl font-bold text-center mb-2 text-white">Crear Cuenta</h2>
        <p class="text-center text-gray-400 mb-6">Regístrate para empezar a comprar.</p>

        <form id="register-form">

            <div class="flex gap-4 mb-4">
                <div class="w-1/2">
                    <label for="nombre" class="block text-sm font-medium text-gray-300 mb-2">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre"
                        class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>
                <div class="w-1/2">
                    <label for="apellido" class="block text-sm font-medium text-gray-300 mb-2">Apellido</label>
                    <input type="text" id="apellido" placeholder="Apellido"
                        class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>
            </div>

            <div class="mb-4">
                <label for="nombreUsuario" class="block text-sm font-medium text-gray-300 mb-2">Nombre de
                    Usuario</label>
                <input type="text" id="nombreUsuario" placeholder="TuUsuario123"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Correo Electrónico</label>
                <input type="email" id="email" placeholder="email@dominio.com"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <div class="mb-4">
                <label for="fechaNacimiento" class="block text-sm font-medium text-gray-300 mb-2">Fecha de
                    Nacimiento</label>
                <input type="date" id="fechaNacimiento"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <div class="mb-6">
                <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-2">Confirmar
                    Contraseña</label>
                <input type="password" id="confirmPassword" placeholder="••••••••"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <div id="error-message"
                class="hidden bg-red-800 border border-red-600 text-red-100 px-4 py-3 rounded-lg mb-4 text-center">
            </div>
            <div id="success-message"
                class="hidden bg-green-800 border border-green-600 text-green-100 px-4 py-3 rounded-lg mb-4 text-center">
            </div>

            <div class="mb-6">
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 ease-in-out transform hover:-translate-y-1">
                    Crear Cuenta
                </button>
            </div>

            <div class="text-center text-sm">
                <span class="text-gray-400">¿Ya tienes cuenta?</span>
                <a href="SigIn.html" class="text-blue-400 hover:text-blue-300 font-medium hover:underline">
                    Inicia Sesión
                </a>
            </div>
        </form>
    </div>

    <script src="js/utils.js"></script>
    <script type="module" src="js/registro.js"></script>

</body>

</html>
