<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Carrito - Evolution Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-blue-900 text-gray-100 min-h-screen">
    
    <header class="sticky top-0 z-50 bg-gray-900/70 backdrop-blur-sm py-4 px-8 border-b-2 border-gray-700 shadow-lg mb-12">
        <div class="container mx-auto max-w-screen-xl flex justify-between items-center gap-8">
            <h1 class="text-3xl font-bold text-blue-400 flex-none">
                <a href="index.html">Evolution Store</a>
            </h1>
            <nav class="space-x-4 flex-none">
                <a href="index.html" class="text-lg text-gray-300 hover:text-blue-400 transition-colors">Tienda</a>
                <a href="carrito.html" class="text-lg text-blue-400 font-bold border-b-2 border-blue-400 pb-1">Carrito</a>
                <a href="usuario.html" class="text-lg text-gray-300 hover:text-blue-400 transition-colors">Perfil</a>
            </nav>
        </div>
    </header>

    <div class="container mx-auto max-w-3xl">
        <div class="bg-gray-800 rounded-xl shadow-2xl p-8">
            <h2 class="text-3xl font-bold text-white mb-6">Mi Carrito</h2>
            
            <div id="cart-items-container" class="space-y-4">
                </div>

            <div id="cart-summary" class="mt-8">
                </div>

            <div id="cart-empty-msg" class="text-center text-gray-400 py-8 hidden">
                <p class="text-xl">Tu carrito está vacío.</p>
                <a href="index.html" class="mt-4 inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Volver a la tienda</a>
            </div>

        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
